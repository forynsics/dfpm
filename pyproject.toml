[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dfpm"
version = "0.1.0"
description = "A package manager for digital forensics tools"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "forynsics" }]
dependencies = []

[project.scripts]
dfpm = "dfpm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dfpm = ["web/*.html", "web/*.js", "web/*.css", "web/*.png"]

