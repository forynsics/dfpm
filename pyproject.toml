[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dfpm"
version = "0.1.0"
description = "A DFIR-native toolchain manager"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "DFPM contributors" }]
dependencies = []

[project.scripts]
dfpm = "dfpm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

