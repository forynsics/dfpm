name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows is the platform dfpm supports, and the suite checks things that
    # only exist there: command shims, path-length limits, reserved device names.
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dfpm
        run: python -m pip install --editable .

      - name: Run the test suite
        # Includes validating every catalog entry, generating the site feed, and
        # checking catalog/index.json still describes what is in catalog/ — the
        # one derived file that has to be committed.
        run: python -m unittest discover -s tests

      - name: Confirm a clean install works from a built wheel
        # The editable install above shares the working tree, so it cannot show
        # whether the entries and web assets are actually packaged. This can.
        run: |
          python -m pip wheel . --no-deps -w dist
          python -m venv fresh
          fresh\Scripts\python.exe -m pip install --no-index --find-links dist dfpm
          fresh\Scripts\dfpm.exe --version
          fresh\Scripts\dfpm.exe catalog

      - name: Confirm the wheel carries every reviewed catalog file
        # This is the only place the claim can honestly be made: a build has just
        # happened, so the staged entries are current rather than left over from
        # whenever somebody last installed.
        shell: python
        run: |
          import pathlib, sys, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          shipped = {n.rsplit("/", 1)[-1] for n in names if "/entries/" in n and "/entries/collections/" not in n}
          reviewed = {p.name for p in pathlib.Path("catalog").glob("*.json")}
          if shipped != reviewed:
              sys.exit(f"wheel carries {sorted(shipped)}, catalog holds {sorted(reviewed)}")
          shipped_collections = {n.rsplit("/", 1)[-1] for n in names if "/entries/collections/" in n}
          reviewed_collections = {p.name for p in pathlib.Path("catalog/collections").glob("*.json")}
          if shipped_collections != reviewed_collections:
              sys.exit(
                  f"wheel carries collections {sorted(shipped_collections)}, "
                  f"catalog holds {sorted(reviewed_collections)}"
              )
          print(f"{len(shipped)} entries and {len(shipped_collections)} collections, matching catalog/")
