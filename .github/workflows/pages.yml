name: site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "catalog/**"
      - "src/dfpm/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dfpm
        run: python -m pip install .

      - name: Generate the catalog feed
        # The site is static and cannot run dfpm, so the feed it reads is built
        # here from catalog/. It is never committed, so it can never be stale.
        run: python -m dfpm --catalog catalog catalog --json > docs/catalog.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
