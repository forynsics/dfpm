name: release candidate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build tooling and dfpm
        run: |
          python -m pip install "setuptools>=77" build
          python -m pip install --editable .

      - name: Require a tag matching the package version
        if: github.ref_type == 'tag'
        shell: python
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          import os
          from dfpm import __version__
          expected = f"v{__version__}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"tag {os.environ['RELEASE_TAG']!r} does not match package version {expected!r}")

      - name: Run the complete test suite
        run: python -m unittest discover -s tests

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify both distribution paths
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist -Filter *.whl | Select-Object -First 1
          $sdist = Get-ChildItem dist -Filter *.tar.gz | Select-Object -First 1
          if (-not $wheel -or -not $sdist) { throw "Expected one wheel and one source distribution." }
          python -m venv release-check
          release-check\Scripts\python.exe -m pip install --no-index --no-deps $wheel.FullName
          release-check\Scripts\dfpm.exe --version
          release-check\Scripts\dfpm.exe catalog
          python -m pip wheel $sdist.FullName --no-deps --wheel-dir rebuilt

      - name: Record artifact checksums
        shell: python
        run: |
          import hashlib, pathlib
          lines = []
          for path in sorted(pathlib.Path("dist").iterdir()):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.name}")
          pathlib.Path("dist/SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="ascii")

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dfpm-${{ github.ref_name }}
          path: |
            dist/*
            rebuilt/*.whl
